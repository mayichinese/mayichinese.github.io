# Tự động đưa thư mục app/ lên GitHub Pages mỗi khi đẩy code lên nhánh main.
# Chỉ thư mục app/ thành trang web; cong-cu/, tai-lieu/... không nằm trong trang web.
name: Đăng trang web

on:
  push:
    branches: [main]
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  dang:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.trien-khai.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: trien-khai
        uses: actions/deploy-pages@v4
