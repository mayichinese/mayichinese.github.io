<!doctype html>
<html lang="vi" data-bang-mau="b" data-giao-dien="toi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Học HSK 60′ – Demo giao diện</title>

  <!-- Phông chữ:
       - Baloo 2 + Nunito : phương án A (tròn, thân thiện)
       - Lexend           : phương án B (gọn, hiện đại)
       - Noto Sans        : pinyin (hiện dấu thanh rõ)
       - Noto Sans SC     : chữ Hán -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&family=Lexend:wght@400;500;600;700&family=Noto+Sans:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="css/chung.css">
  <link rel="stylesheet" href="css/man-hinh.css">

  <!-- Đặt màu ngay từ đầu để trang không bị "nháy" màu khi mở -->
  <script>
    (function () {
      try {
        var caiDat = JSON.parse(localStorage.getItem('demoHSK.caiDat') || '{}');
        var goc = document.documentElement;
        goc.dataset.bangMau = caiDat.bangMau === 'a' ? 'a' : 'b';   // mặc định: B
        // Mặc định: A sáng, B tối (nếu chưa chọn)
        var cheDo = caiDat.cheDo || 'mac-dinh';
        var toi = cheDo === 'toi' ||
          (cheDo === 'tu-dong' && window.matchMedia('(prefers-color-scheme: dark)').matches) ||
          (cheDo === 'mac-dinh' && goc.dataset.bangMau === 'b');
        goc.dataset.giaoDien = toi ? 'toi' : 'sang';
      } catch (e) { /* không đọc được cài đặt thì dùng mặc định */ }
    })();
  </script>
</head>
<body>

  <!-- Thanh điều hướng: dưới đáy trên điện thoại, bên trái trên máy tính -->
  <nav class="dieu-huong" aria-label="Điều hướng chính">
    <a class="thuong-hieu" href="#hom-nay" aria-label="Trang chủ">
      <span class="logo">60′</span>
      <span class="ten-app">Học HSK<small>60 phút mỗi ngày</small></span>
    </a>
    <a href="#hom-nay"   data-man="hom-nay"><span data-bt="nha"></span><span>Hôm nay</span></a>
    <a href="#bai-hoc"   data-man="bai-hoc"><span data-bt="sach"></span><span>Bài học</span></a>
    <a href="#the-tu"    data-man="the-tu"><span data-bt="the"></span><span>Thẻ từ</span></a>
    <a href="#luyen-tap" data-man="luyen-tap"><span data-bt="but"></span><span>Luyện tập</span></a>
    <a href="#thong-ke"  data-man="thong-ke"><span data-bt="bieu-do"></span><span>Thống kê</span></a>
  </nav>

  <div class="vung-chinh">
    <!-- Thanh trên cùng: tên màn hình + nút đổi màu, sáng/tối, cài đặt -->
    <header class="thanh-tren">
      <button id="nut-quay-lai" class="nut-bieu-tuong an" aria-label="Quay lại"></button>
      <h1 id="tieu-de-man-hinh">Hôm nay</h1>
      <div class="nhom-nut-tren">
        <button id="nut-doi-mau" class="nut-bieu-tuong" aria-label="Đổi phương án màu" title="Đổi phương án màu (A/B)"></button>
        <button id="nut-sang-toi" class="nut-bieu-tuong" aria-label="Đổi sáng/tối" title="Đổi sáng/tối"></button>
        <button id="nut-cai-dat" class="nut-bieu-tuong" aria-label="Cài đặt" title="Cài đặt"></button>
      </div>
    </header>

    <!-- Nội dung từng màn hình sẽ được vẽ vào đây -->
    <main id="noi-dung" tabindex="-1">
      <div class="dang-tai">Đang tải dữ liệu…</div>
    </main>
  </div>

  <!-- Lớp phủ cho hộp thoại / bảng cài đặt -->
  <div id="lop-phu" hidden></div>

  <!-- Thông báo ngắn hiện ở dưới -->
  <div id="thong-bao" role="status" aria-live="polite"></div>

  <!-- Các file JavaScript (thứ tự quan trọng: phần dùng chung trước, màn hình sau) -->
  <script src="js/bieu-tuong.js"></script>
  <script src="js/luu-tru.js"></script>
  <script src="js/pinyin.js"></script>
  <script src="js/du-lieu.js"></script>
  <script src="js/giong-doc.js"></script>
  <script src="js/ung-dung.js"></script>
  <script src="js/trang-chu.js"></script>
  <script src="js/flashcard.js"></script>
  <script>UngDung.khoiDong();</script>
</body>
</html>
